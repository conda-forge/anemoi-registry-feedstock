{% set version = "0.3.3" %}
{% set python_min = "3.11" %}

package:
  name: anemoi-registry
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/anemoi-registry/anemoi_registry-{{ version }}.tar.gz
  sha256: 0d8064aaa5d7a3169a6f00874c8e60f450b4674dbe48f90be4a55ad91a9d3aca

build:
  entry_points:
    - anemoi-registry = anemoi.registry.__main__:main_PYTHON_ARGCOMPLETE_OK
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - anemoi-datasets >=0.5.28
    - anemoi-utils >=0.4.39
    - jsonpatch
    - requests

test:
  imports:
    - anemoi
  commands:
    - anemoi-registry --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ecmwf/anemoi-registry/
  summary: A package to manage a registry or data-driven forecasts.
  doc_url: https://anemoi-registry.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tjtg
    - jasonjunweilyu
    - HCookie
